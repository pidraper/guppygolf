[project]
name = "quantum-golf"
version = "0.1.0"
description = "Mini-golf simulation powered by Guppy and the Selene emulator"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "contourpy==1.3.3",
    "guppylang==1.0.4",
    "moderngl==5.12.0",
    "numpy==2.4.6",
    "pyglet==2.1.14",
    "selene-core==0.3.2",
    "selene-sim==0.3.2",
]

[tool.uv]
package = false
